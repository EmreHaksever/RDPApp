<!DOCTYPE html>
<html>
<head>
    <title>Guacamole-Common.js Test</title>
</head>
<body>

    <h1>Guacamole Kütüphanesi Test Sayfası</h1>
    <p>Sonuçları görmek için F12 tuşuna basarak Geliştirici Konsolu'nu açın.</p>

    <script src="js/guacamole-common.js"></script>

    <script>
        console.log("Test başlıyor...");

        // Test 1: Guacamole ana nesnesi var mı?
        if (typeof Guacamole !== 'undefined') {
            console.log("✅ BAŞARILI: 'Guacamole' ana nesnesi bulundu.");
        } else {
            console.error("❌ BAŞARISIZ: 'Guacamole' ana nesnesi bulunamadı!");
        }

        // Test 2: Guacamole.Client nesnesi var mı?
        if (typeof Guacamole !== 'undefined' && typeof Guacamole.Client !== 'undefined') {
            console.log("✅ BAŞARILI: 'Guacamole.Client' nesnesi bulundu.");
        } else {
            console.error("❌ BAŞARISIZ: 'Guacamole.Client' nesnesi bulunamadı!");
        }

        // Test 3: Guacamole.WebSocketTunnel nesnesi var mı?
        if (typeof Guacamole !== 'undefined' && typeof Guacamole.WebSocketTunnel !== 'undefined') {
            console.log("✅ BAŞARILI: 'Guacamole.WebSocketTunnel' nesnesi bulundu.");
        } else {
            console.error("❌ BAŞARISIZ: 'Guacamole.WebSocketTunnel' nesnesi bulunamadı!");
        }

        console.log("Test tamamlandı.");
    </script>

</body>
</html>
